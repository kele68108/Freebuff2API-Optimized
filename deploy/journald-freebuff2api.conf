# Freebuff2API journald rotation drop-in — plan §5.
# Install to /etc/systemd/journald.conf.d/freebuff2api.conf, then:
#   systemctl restart systemd-journald
#   journalctl --vacuum-size=500M   (immediately reclaim over-budget space)
[Journal]
SystemMaxUse=500M
MaxRetentionSec=14day
SystemKeepFree=2G
SystemMaxFileSize=32M
MaxFileSec=1week
Compress=yes
Seal=yes
